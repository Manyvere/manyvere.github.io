<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manyvere</title>
<link rel="icon" href="/icon.svg">
<style>
  html,body{margin:0;height:100%}
  body{background:#f4f0e7;color:#23221e;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .mark{width:64px;height:64px;border-radius:16px;border:2px solid #7f8a63;background:#fbf9f4;
        display:flex;align-items:center;justify-content:center;margin:0 auto 26px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#7f8a63}
  .dot.amber{background:#c98a4b}
  .word{font-family:Georgia,"Times New Roman",serif;font-size:52px;font-weight:600;letter-spacing:.5px}
  .rule{width:46px;height:1px;background:#cfc8ba;margin:24px auto}
  .tag{font-size:15px;color:#6b6760;letter-spacing:2px;text-transform:uppercase}
  .sub{font-size:13px;color:#9a958b;margin-top:10px}
</style>
</head>
<body>
  <main>
    <div class="mark"><div class="grid">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot amber"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div></div>
    <div class="word">Manyvere</div>
    <div class="rule"></div>
    <div class="tag">Under construction</div>
    <div class="sub">We&rsquo;re building something.</div>
  </main>
</body>
</html>
