<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineage by Manyvere</title>
<meta name="description" content="Lineage by Manyvere.">
<meta name="theme-color" content="#102218">
<!-- Interim favicon: the logo mark itself. It is too fine-lined to resolve at
     16px and has no ground of its own, so it reads as a smudge on a light tab
     bar. A dedicated favicon render (mark on a dark green tile, heavier
     strokes) is pending — see docs/marketing/prompts/. -->
<link rel="icon" type="image/svg+xml" href="assets/Lineage_logo_mark_gold.svg">
<style>
/* ============================================================================
   Lineage — landing hero.
   Every brand element is a supplied production SVG. Nothing here typesets,
   redraws or approximates the identity; CSS only positions and scales it.
   Proportions are derived from Lineage_hero_reference.png (1672x941) and are
   expressed relative to the wordmark width, so the lock-up holds at any size.
   ========================================================================= */
:root{
  --ground:#102218;
  --forest:#1B2D1A;

  /* The wordmark is the unit everything else is measured against. */
  --wordmark-w:clamp(238px, 41vw, 680px);

  /* Each supplied SVG carries transparent padding inside its own viewBox, so a
     box-to-box gap is NOT the gap you see. Ink extents were measured per asset
     (getBBox incl. stroke) and the box widths and margins below are back-
     calculated so that the INK matches the proportions of the approved
     Lineage_hero_reference.png. Box widths therefore exceed the visible sizes,
     and three margins are negative — that is the padding compensation, not a
     tightened lock-up. */

  /* Box widths: visible-ink target / ink fraction of the box */
  --mark-w:calc(var(--wordmark-w) * 0.3414);  /* ink 0.199W, ink = 58.3% of box */
  --line-w:calc(var(--wordmark-w) * 1.1046);  /* ink 1.038W, ink = 94.0% of box */
  --by-w:calc(var(--wordmark-w) * 0.3535);    /* ink 0.331W, ink = 93.6% of box */

  /* The signature line (rendered PNG, 2172x724) is positioned by its CENTRE,
     not its box: the seal overhangs above and below the line itself. Its
     centre sits 0.4876 of the box height down, and the box carries 0.1851
     top padding. Placing the centre 0.018W under the "g" descender puts the
     line snug against the wordmark, which is where it belongs. */
  --gap-mark:calc(var(--wordmark-w) * -0.0756);
  --gap-line:calc(var(--wordmark-w) * -0.1892);
  --gap-by:calc(var(--wordmark-w) * -0.0788);

  /* The mark's ink sits right of its box centre (the seal overhangs). The new
     line's ink is centred to within 0.1%, so it needs no nudge. */
  --mark-shift:calc(var(--wordmark-w) * -0.0172);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:#FDE5CA;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative; isolation:isolate; overflow:hidden;
  min-height:100svh;
  display:grid; place-items:center;
  padding:clamp(24px,6vw,80px);
}

/* Organic stone ground. The supplied assets carry their own material
   treatment, so nothing is layered on top of them. */
.stage::before{
  content:""; position:absolute; inset:0; z-index:-2;
  background:url("assets/Lineage_background_marble.jpg") center/cover no-repeat;
}
/* Vignette: deepens the corners so the cream wordmark keeps its contrast
   wherever the stone happens to be lightest. */
.stage::after{
  content:""; position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(120% 90% at 50% 46%, rgba(16,34,24,0) 0%, rgba(16,34,24,.28) 62%, rgba(16,34,24,.58) 100%);
}

.lockup{
  display:flex; flex-direction:column; align-items:center;
  width:min(100%, 900px);
}

/* object-fit:contain + intrinsic aspect ratio: never stretched or squashed.
   No width here on purpose — a shared `.lockup img` width rule would outrank
   the per-element `.mark` / `.wordmark` classes below and flatten the lock-up. */
.lockup img{display:block; height:auto; object-fit:contain; max-width:100%}

.mark{width:var(--mark-w); margin-bottom:var(--gap-mark); transform:translateX(var(--mark-shift))}
.wordmark{width:var(--wordmark-w)}
.signature{width:var(--line-w); margin-top:var(--gap-line)}
.by{width:var(--by-w); margin-top:var(--gap-by)}

/* Phones: the reference proportions get cramped below ~420px, so the
   wordmark is allowed a larger share of the viewport. */
@media (max-width:520px){
  :root{--wordmark-w:clamp(200px, 68vw, 320px)}
}

/* The lock-up is static artwork; a gentle settle on load, disabled for
   anyone who asked for reduced motion. */
@media (prefers-reduced-motion:no-preference){
  .lockup{animation:settle 1.1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes settle{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
}

.stage{display:flex;flex-direction:column;justify-content:center;gap:42px;padding:40px 24px;min-height:100svh}
:root{--wordmark-w:clamp(238px,32vw,490px)}
/* Matte green / bronze drift; no bevel or specular highlight. */
.login{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;min-width:132px;min-height:46px;padding:12px 28px;border:1px solid #777b50;border-radius:4px;background:linear-gradient(115deg,#193f32 0%,#35523b 28%,#665831 52%,#324c38 75%,#193f32 100%);background-size:300% 100%;background-position:15% 50%;color:#fde5ca;font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;opacity:1;box-shadow:none}
.login:disabled{cursor:not-allowed}
.login:focus-visible{outline:2px solid #fde5ca;outline-offset:4px}
@media(prefers-reduced-motion:no-preference){
  .login{animation:mineral-drift 12s ease-in-out infinite alternate}
  @keyframes mineral-drift{from{background-position:0% 50%}to{background-position:100% 50%}}
}
@media(max-width:520px){:root{--wordmark-w:clamp(200px,68vw,320px)}.stage{gap:32px}}
</style>
</head>
<body>

<main class="stage">
  <div class="lockup" role="img" aria-label="Lineage by Manyvere">
    <img class="mark"      src="assets/Lineage_logo_mark_gold.svg"      alt="Lineage logo mark">
    <img class="wordmark"  src="assets/Lineage_wordmark_cream.svg"      alt="Lineage">
    <img class="signature" src="assets/Lineage_signature_line_gold.png" alt="">
    <img class="by"        src="assets/Lineage_by_manyvere_gold.svg"    alt="by Manyvere">
  </div>
<a class="login" href="/lineage/login">Log in</a>
</main>

</body>
</html>
